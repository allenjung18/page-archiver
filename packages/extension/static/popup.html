<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>page-archiver</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
  <h1>Save to archive</h1>
  <p id="page" class="page"></p>
  <label for="tags">Tags</label>
  <input id="tags" type="text" placeholder="comma, separated" autocomplete="off">
  <button id="save" type="button">Save page</button>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="open" type="button" class="link" hidden>Open in library</button>
  <details id="settings">
    <summary>Library server</summary>
    <form id="server-form">
      <input id="server" type="url" aria-label="Library server address">
      <button type="submit">Set</button>
    </form>
  </details>
</main>
<script src="popup.js"></script>
</body>
</html>
