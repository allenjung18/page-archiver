<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>url() written with CSS escapes</title>
<!-- A function's name may be written with CSS escapes: Chromium reads "\75rl(", "u\72l(" and
     "\55 RL(" as a url( and "image-s\65t(" as an image-set(, in a <style>, a style attribute, a
     linked sheet, a font's src list and an SVG attribute alike. Each must be inlined, or copied in:
     opened from disk with no CSP, the archive must make no request. -->
<link rel="stylesheet" href="{{ASSETS}}/css/escaped-url.css">
<style>
  @font-face {
    font-family: "Escaped Pacifico";
    font-style: normal;
    font-weight: 400;
    font-display: block;
    src: \75rl("{{ASSETS}}/fonts/pacifico-latin-400-normal.woff2") format("woff2"), url("{{ASSETS}}/fonts/pacifico-latin-400-normal.woff") format("woff");
  }
  .title { font-family: "Escaped Pacifico", Georgia, serif; font-weight: 400; }
  .a { width: 320px; height: 120px; background: #d8e0c8 \75rl({{ASSETS}}/img/figure.png) no-repeat; }
  .c { width: 640px; max-width: 100%; height: 160px; margin-top: 16px; background-image: image-s\65t("{{ASSETS}}/img/hero.png" 1x); background-size: cover; }
  .shapes svg { display: block; width: 600px; height: 120px; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <article>
    <h1 class="title">Escaped function names</h1>
    <p class="byline">By A. Fixture &middot; 20 October 2026</p>
    <div class="a"></div>
    <div class="b" style="width: 320px; height: 120px; margin-top: 16px; background: #e8d8c0 u\72l('{{ASSETS}}/img/lazy-1.png') no-repeat"></div>
    <div class="c"></div>
    <div class="sb"></div>
    <div class="shapes">
      <svg viewBox="0 0 600 120">
        <rect x="20" y="20" width="120" height="80" fill="#36c" filter="u\72l(/sprites/fx.svg#soft)" cursor="\75rl({{ASSETS}}/img/figure.png) 2 2, pointer"/>
      </svg>
    </div>
  </article>
</main>
</body>
</html>
