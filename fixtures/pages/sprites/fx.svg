<?xml version="1.0" encoding="utf-8"?>
<!-- Effects a page's SVG attributes name by url() in this file: served from the pages origin, as a same-origin file. -->
<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#c47a2c"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
  </defs>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <mask id="fade" maskContentUnits="objectBoundingBox">
    <rect width="1" height="1" fill="url(#ramp)"/>
  </mask>
  <clipPath id="half" clipPathUnits="objectBoundingBox">
    <rect width="0.5" height="1"/>
  </clipPath>
  <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
    <circle cx="5" cy="5" r="5" fill="#1d1b16"/>
  </marker>
  <pattern id="stripes" width="12" height="12" patternUnits="userSpaceOnUse">
    <rect width="6" height="12" fill="#36c"/>
  </pattern>
</svg>
