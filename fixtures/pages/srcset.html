<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Responsive images</title>
<style>
  body { margin: 0; font: 16px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #222; background: #fff; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  figure { margin: 0; }
  img { display: block; width: 480px; height: 270px; }
</style>
</head>
<body>
<main>
  <figure>
    <img src="{{ASSETS}}/img/lazy-1.png" srcset="{{ASSETS}}/img/lazy-1.png 1x, {{ASSETS}}/img/lazy-2.png 2x" alt="density">
    <figcaption>x descriptors: at 1x the browser shows the first candidate.</figcaption>
  </figure>
  <figure>
    <img src="{{ASSETS}}/img/lazy-8.png" srcset="{{ASSETS}}/img/lazy-3.png 480w, {{ASSETS}}/img/lazy-4.png 1600w" sizes="480px" alt="widths">
    <figcaption>w descriptors with sizes: the 480w candidate, not src.</figcaption>
  </figure>
  <figure>
    <picture>
      <source media="(max-width: 600px)" srcset="{{ASSETS}}/img/lazy-5.png">
      <source media="(min-width: 601px)" srcset="{{ASSETS}}/img/lazy-6.png">
      <img src="{{ASSETS}}/img/lazy-7.png" alt="picture">
    </picture>
    <figcaption>&lt;picture&gt; with media sources: the wide-screen source.</figcaption>
  </figure>
  <figure>
    <picture>
      <source type="image/x-never" srcset="{{ASSETS}}/img/lazy-2.png">
      <img src="{{ASSETS}}/img/hero.png" alt="fallback" style="object-fit: cover">
    </picture>
    <figcaption>a source of a type no browser knows: the &lt;img&gt;.</figcaption>
  </figure>
</main>
</body>
</html>
