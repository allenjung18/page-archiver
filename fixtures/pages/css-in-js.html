<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS-in-JS</title>
<!-- styled-components and emotion in production add every rule with insertRule: the <style>
     elements below stay empty (or stale) while the CSSOM holds the real rules. -->
<style data-styled="active" data-styled-version="6.1.0"></style>
<style data-emotion="css">.css-stale { color: red; }</style>
<style id="switched-off">body { background: #c00 !important; }</style>
</head>
<body>
<div id="root"></div>
<script>
  const ASSETS = "{{ASSETS}}";
  const styled = document.querySelector("style[data-styled]").sheet;
  const rules = [
    `body { margin: 0; font: 17px/1.55 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #1d2a33; background: #f4f1ea; }`,
    `.sc-a1b2c3 { max-width: 760px; margin: 0 auto; padding: 32px 24px; }`,
    `.sc-d4e5f6 { padding: 28px 32px; border-radius: 10px; color: #fff; background: #20435c url("${ASSETS}/img/paper.png") repeat; }`,
    `.sc-d4e5f6 h1 { margin: 0 0 8px; font-size: 34px; letter-spacing: -0.01em; }`,
    `.sc-g7h8i9 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; }`,
    `.sc-g7h8i9 > div { background: #fff; border: 1px solid #ddd3c2; border-radius: 8px; padding: 16px; }`,
    `.sc-g7h8i9 > div::before { content: "\\2605  "; color: #c9822b; }`,
    `@media (min-width: 900px) { .sc-a1b2c3 { padding-top: 56px; } }`,
  ];
  rules.forEach((r, i) => styled.insertRule(r, i));
  // emotion: the element's text says one thing, the CSSOM another
  const emotion = document.querySelector("style[data-emotion]").sheet;
  emotion.deleteRule(0);
  emotion.insertRule(`.css-1x2y3z { margin-top: 24px; padding: 18px 20px; border-left: 6px solid #2b7a4b; background: #e4f2e8; }`, 0);
  emotion.insertRule(`.css-1x2y3z img { display: block; width: 320px; height: 180px; margin-top: 12px; }`, 1);
  // a sheet the page switched off: it must stay off in the archive
  document.getElementById("switched-off").sheet.disabled = true;

  document.getElementById("root").innerHTML = `
    <div class="sc-a1b2c3">
      <header class="sc-d4e5f6"><h1>Styled at runtime</h1><p>Every rule on this page was added through the CSSOM.</p></header>
      <section class="sc-g7h8i9">
        <div>insertRule into an empty &lt;style&gt;</div>
        <div>deleteRule, then insertRule, under stale text</div>
        <div>a sheet disabled by script</div>
      </section>
      <aside class="css-1x2y3z">An emotion block, with a picture:<img src="${ASSETS}/img/figure.png" alt="figure"></aside>
    </div>`;
</script>
</body>
</html>
